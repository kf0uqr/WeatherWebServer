<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Station</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f172a;
    --card: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 48px;
  }
  h1 {
    text-align: center;
    font-size: 1.5rem;
    margin-bottom: 4px;
  }
  #status {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 24px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
    max-width: 720px;
    margin: 0 auto 32px;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
  }
  .card .label {
    color: var(--muted);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .card .value {
    font-size: 2rem;
    font-weight: 600;
    margin-top: 8px;
    color: var(--accent);
  }
  .card .unit {
    font-size: 1rem;
    color: var(--muted);
  }
  canvas {
    display: block;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    background: var(--card);
    border-radius: 12px;
  }
</style>
</head>
<body>
  <h1>Weather Station</h1>
  <div id="status">connecting&hellip;</div>

  <div class="grid">
    <div class="card">
      <div class="label">Temperature</div>
      <div class="value"><span id="temp">--</span><span class="unit">&deg;F</span></div>
    </div>
    <div class="card">
      <div class="label">Humidity</div>
      <div class="value"><span id="humidity">--</span><span class="unit">%</span></div>
    </div>
    <div class="card">
      <div class="label">Pressure</div>
      <div class="value"><span id="pressure">--</span><span class="unit">hPa</span></div>
    </div>
    <div class="card">
      <div class="label">Altitude</div>
      <div class="value"><span id="altitude">--</span><span class="unit">m</span></div>
    </div>
  </div>

  <canvas id="chart" width="720" height="240"></canvas>

<script>
const statusEl = document.getElementById('status');

function setStatus(text, ok) {
  statusEl.textContent = text;
  statusEl.style.color = ok ? '#4ade80' : '#f87171';
}

async function pollCurrent() {
  try {
    const res = await fetch('/api/current');
    const data = await res.json();
    if (!data.valid) {
      setStatus('sensor not detected', false);
      return;
    }
    document.getElementById('temp').textContent = data.temperature_f.toFixed(1);
    document.getElementById('humidity').textContent = data.humidity_pct.toFixed(0);
    document.getElementById('pressure').textContent = data.pressure_hpa.toFixed(1);
    document.getElementById('altitude').textContent = data.altitude_m.toFixed(0);
    setStatus('updated ' + new Date().toLocaleTimeString(), true);
  } catch (err) {
    setStatus('connection lost, retrying...', false);
  }
}

function drawChart(points) {
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  if (points.length < 2) return;

  const temps = points.map(p => p.temperature_c * 9 / 5 + 32);
  const min = Math.min(...temps) - 2;
  const max = Math.max(...temps) + 2;

  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 2;
  ctx.beginPath();
  temps.forEach((t, i) => {
    const x = (i / (temps.length - 1)) * (w - 20) + 10;
    const y = h - 20 - ((t - min) / (max - min || 1)) * (h - 40);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  ctx.fillStyle = '#94a3b8';
  ctx.font = '12px sans-serif';
  ctx.fillText(max.toFixed(0) + '°F', 8, 16);
  ctx.fillText(min.toFixed(0) + '°F', 8, h - 8);
}

async function pollHistory() {
  try {
    const res = await fetch('/api/history');
    const data = await res.json();
    drawChart(data.points || []);
  } catch (err) {
    // Chart just stays stale until the next successful poll.
  }
}

pollCurrent();
pollHistory();
setInterval(pollCurrent, 5000);
setInterval(pollHistory, 30000);
</script>
</body>
</html>
