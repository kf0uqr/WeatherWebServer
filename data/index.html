<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KF0UQR Weather Station</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f172a;
    --card: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 48px;
  }
  h1 {
    text-align: center;
    font-size: 1.5rem;
    margin-bottom: 4px;
  }
  #status {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 24px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
    max-width: 720px;
    margin: 0 auto 32px;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
  }
  .card .label {
    color: var(--muted);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .card .value {
    font-size: 2rem;
    font-weight: 600;
    margin-top: 8px;
    color: var(--accent);
  }
  .card .unit {
    font-size: 1rem;
    color: var(--muted);
  }
  .charts {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    max-width: 720px;
    margin: 0 auto 32px;
  }
  .chart-panel {
    background: var(--card);
    border-radius: 12px;
    padding: 12px 12px 8px;
  }
  .chart-panel .chart-title {
    color: var(--muted);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0 0 6px 4px;
  }
  .chart-panel canvas {
    display: block;
    width: 100%;
  }
  #forecast {
    max-width: 720px;
    margin: 0 auto 24px;
    background: var(--card);
    border-radius: 12px;
    padding: 16px 20px;
    text-align: center;
  }
  #forecast .label {
    color: var(--muted);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  #forecast .text {
    font-size: 1.1rem;
    margin-top: 6px;
  }
  #forecast .trend {
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 2px;
  }
  h2 {
    max-width: 720px;
    margin: 32px auto 12px;
    font-size: 1.1rem;
    color: var(--muted);
  }
  .trends-header {
    max-width: 720px;
    margin: 32px auto 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .trends-header h2 {
    margin: 0;
  }
  #range-select {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--muted);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.85rem;
  }
  #trends-notice {
    max-width: 720px;
    margin: 0 auto 12px;
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
    min-height: 1.2em;
  }
  #radar {
    max-width: 720px;
    margin: 0 auto;
    border-radius: 12px;
    overflow: hidden;
    background: var(--card);
  }
  #radar iframe {
    display: block;
    width: 100%;
    height: 420px;
    border: 0;
  }
  #radar .setup-notice {
    padding: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <h1>KF0UQR Weather Station</h1>
  <div id="status">connecting&hellip;</div>

  <div class="grid">
    <div class="card">
      <div class="label">Temperature</div>
      <div class="value"><span id="temp">--</span><span class="unit">&deg;F</span></div>
    </div>
    <div class="card">
      <div class="label">Humidity</div>
      <div class="value"><span id="humidity">--</span><span class="unit">%</span></div>
    </div>
    <div class="card">
      <div class="label">Pressure</div>
      <div class="value"><span id="pressure">--</span><span class="unit">hPa</span></div>
    </div>
    <div class="card">
      <div class="label">Altitude</div>
      <div class="value"><span id="altitude">--</span><span class="unit">m</span></div>
    </div>
    <div class="card">
      <div class="label">Rain</div>
      <div class="value"><span id="rain">--</span><span class="unit">%</span></div>
    </div>
  </div>

  <div id="forecast">
    <div class="label">Forecast</div>
    <div class="text" id="forecast-text">--</div>
    <div class="trend" id="forecast-trend"></div>
  </div>

  <h2>Radar</h2>
  <div id="radar"></div>

  <div class="trends-header">
    <h2>Trends</h2>
    <select id="range-select">
      <option value="1h">Last 1 hour</option>
      <option value="6h">Last 6 hours</option>
      <option value="12h">Last 12 hours</option>
      <option value="1d" selected>Last 1 day</option>
      <option value="1w">Last 1 week</option>
      <option value="1mo">Last 1 month</option>
      <option value="1y">Last 1 year</option>
      <option value="all">All time</option>
    </select>
  </div>
  <div id="trends-notice"></div>
  <div class="charts">
    <div class="chart-panel">
      <div class="chart-title">Temperature</div>
      <canvas id="chart-temp" width="720" height="160"></canvas>
    </div>
    <div class="chart-panel">
      <div class="chart-title">Humidity</div>
      <canvas id="chart-humidity" width="720" height="160"></canvas>
    </div>
    <div class="chart-panel">
      <div class="chart-title">Pressure</div>
      <canvas id="chart-pressure" width="720" height="160"></canvas>
    </div>
  </div>

<script>
const statusEl = document.getElementById('status');

function setStatus(text, ok) {
  statusEl.textContent = text;
  statusEl.style.color = ok ? '#4ade80' : '#f87171';
}

async function pollCurrent() {
  try {
    const res = await fetch('/api/current');
    const data = await res.json();

    document.getElementById('temp').textContent = data.temp_valid ? data.temperature_f.toFixed(1) : '--';
    document.getElementById('humidity').textContent = data.humidity_valid ? data.humidity_pct.toFixed(0) : '--';
    document.getElementById('pressure').textContent = data.pressure_valid ? data.pressure_hpa.toFixed(1) : '--';
    document.getElementById('altitude').textContent = data.pressure_valid ? data.altitude_m.toFixed(0) : '--';

    const rainEl = document.getElementById('rain');
    rainEl.textContent = data.rain_valid ? data.rain_intensity_pct.toFixed(0) : '--';
    rainEl.style.color = data.rain_valid && data.is_raining ? '#38bdf8' : '';

    document.getElementById('forecast-text').textContent = data.forecast || '--';
    document.getElementById('forecast-trend').textContent = data.forecast_trend_valid
      ? (data.forecast_trend_hpa_3h >= 0 ? '+' : '') + data.forecast_trend_hpa_3h.toFixed(1) + ' hPa over 3h'
      : '';

    if (!data.temp_valid || !data.humidity_valid || !data.pressure_valid || !data.rain_valid) {
      const missing = [
        !data.temp_valid && 'DS18B20',
        !data.humidity_valid && 'DHT11',
        !data.pressure_valid && 'BMP280',
        !data.rain_valid && 'rain sensor',
      ].filter(Boolean).join(', ');
      setStatus(missing + ' not detected', false);
    } else {
      setStatus((data.is_raining ? 'raining — ' : '') + 'updated ' + new Date().toLocaleTimeString(), true);
    }
  } catch (err) {
    setStatus('connection lost, retrying...', false);
  }
}

// Each measurement gets its own small-multiple chart with its own scale,
// rather than overlaying series with different units on one shared axis.
// `dataKey` selects which array the /api/history/range response supplies;
// each point in that array is {t: <RFC3339 string>, v: <raw value>}.
const CHART_SERIES = [
  { canvasId: 'chart-temp', dataKey: 'temperature', color: '#3987e5', unit: '°F', decimals: 0,
    valueOf: p => p.v * 9 / 5 + 32 },
  { canvasId: 'chart-humidity', dataKey: 'humidity', color: '#d95926', unit: '%', decimals: 0,
    valueOf: p => p.v },
  { canvasId: 'chart-pressure', dataKey: 'pressure', color: '#199e70', unit: ' hPa', decimals: 1,
    valueOf: p => p.v },
];

function drawSeries(series, points) {
  const canvas = document.getElementById(series.canvasId);
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  if (points.length < 2) return;

  const values = points.map(series.valueOf);
  const pad = (Math.max(...values) - Math.min(...values)) * 0.1 || 1;
  const min = Math.min(...values) - pad;
  const max = Math.max(...values) + pad;

  ctx.strokeStyle = series.color;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  values.forEach((v, i) => {
    const x = (i / (values.length - 1)) * (w - 20) + 10;
    const y = h - 20 - ((v - min) / (max - min || 1)) * (h - 40);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  ctx.fillStyle = '#94a3b8';
  ctx.font = '11px sans-serif';
  ctx.fillText(max.toFixed(series.decimals) + series.unit, 6, 14);
  ctx.fillText(min.toFixed(series.decimals) + series.unit, 6, h - 6);
}

const rangeSelect = document.getElementById('range-select');
const trendsNoticeEl = document.getElementById('trends-notice');

async function pollHistory() {
  const range = rangeSelect.value;
  try {
    const res = await fetch('/api/history/range?range=' + encodeURIComponent(range));
    const data = await res.json();

    CHART_SERIES.forEach(series => drawSeries(series, data[series.dataKey] || []));

    if (!data.ok) {
      trendsNoticeEl.textContent = 'Could not reach InfluxDB - showing whatever data is available.';
    } else if (CHART_SERIES.every(series => (data[series.dataKey] || []).length === 0)) {
      trendsNoticeEl.textContent = 'No data yet for this time range.';
    } else {
      trendsNoticeEl.textContent = '';
    }
  } catch (err) {
    trendsNoticeEl.textContent = 'Could not load trend data.';
  }
}

async function initRadar() {
  const radarEl = document.getElementById('radar');

  let lat = 0, lon = 0;
  try {
    const res = await fetch('/api/config');
    const data = await res.json();
    lat = data.station_lat;
    lon = data.station_lon;
  } catch (err) {
    radarEl.innerHTML = '<div class="setup-notice">Could not load station coordinates from the device.</div>';
    return;
  }

  if (lat === 0 && lon === 0) {
    radarEl.innerHTML = '<div class="setup-notice">Set STATION_LAT / STATION_LON in include/secrets.h to your coordinates to show radar here.</div>';
    return;
  }

  // RainViewer's free embeddable map, no API key required.
  const src = 'https://www.rainviewer.com/map.html?loc=' + lat + ',' + lon +
    ',7&oFa=0&oC=1&oU=0&oCS=1&c=3&o=83&lm=1&layer=radar&sm=1&sn=1';
  const iframe = document.createElement('iframe');
  iframe.src = src;
  iframe.loading = 'lazy';
  iframe.title = 'Radar';
  radarEl.appendChild(iframe);
}

rangeSelect.addEventListener('change', pollHistory);

pollCurrent();
pollHistory();
initRadar();
setInterval(pollCurrent, 5000);
setInterval(pollHistory, 30000);
</script>
</body>
</html>
