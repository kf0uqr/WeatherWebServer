<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Station</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f172a;
    --card: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 48px;
  }
  h1 {
    text-align: center;
    font-size: 1.5rem;
    margin-bottom: 4px;
  }
  #status {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 24px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
    max-width: 720px;
    margin: 0 auto 32px;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
  }
  .card .label {
    color: var(--muted);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .card .value {
    font-size: 2rem;
    font-weight: 600;
    margin-top: 8px;
    color: var(--accent);
  }
  .card .unit {
    font-size: 1rem;
    color: var(--muted);
  }
  canvas {
    display: block;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    background: var(--card);
    border-radius: 12px;
  }
  #forecast {
    max-width: 720px;
    margin: 0 auto 24px;
    background: var(--card);
    border-radius: 12px;
    padding: 16px 20px;
    text-align: center;
  }
  #forecast .label {
    color: var(--muted);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  #forecast .text {
    font-size: 1.1rem;
    margin-top: 6px;
  }
  #forecast .trend {
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 2px;
  }
  h2 {
    max-width: 720px;
    margin: 32px auto 12px;
    font-size: 1.1rem;
    color: var(--muted);
  }
  #radar {
    max-width: 720px;
    margin: 0 auto;
    border-radius: 12px;
    overflow: hidden;
    background: var(--card);
  }
  #radar iframe {
    display: block;
    width: 100%;
    height: 420px;
    border: 0;
  }
  #radar .setup-notice {
    padding: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <h1>Weather Station</h1>
  <div id="status">connecting&hellip;</div>

  <div class="grid">
    <div class="card">
      <div class="label">Temperature</div>
      <div class="value"><span id="temp">--</span><span class="unit">&deg;F</span></div>
    </div>
    <div class="card">
      <div class="label">Humidity</div>
      <div class="value"><span id="humidity">--</span><span class="unit">%</span></div>
    </div>
    <div class="card">
      <div class="label">Pressure</div>
      <div class="value"><span id="pressure">--</span><span class="unit">hPa</span></div>
    </div>
    <div class="card">
      <div class="label">Altitude</div>
      <div class="value"><span id="altitude">--</span><span class="unit">m</span></div>
    </div>
    <div class="card">
      <div class="label">Rain</div>
      <div class="value"><span id="rain">--</span><span class="unit">%</span></div>
    </div>
  </div>

  <div id="forecast">
    <div class="label">Forecast</div>
    <div class="text" id="forecast-text">--</div>
    <div class="trend" id="forecast-trend"></div>
  </div>

  <canvas id="chart" width="720" height="240"></canvas>

  <h2>Radar</h2>
  <div id="radar"></div>

<script>
// Set these to your station's coordinates to enable the radar map below
// (get them from Google Maps: right-click your location -> copy coordinates).
const STATION_LAT = 0;
const STATION_LON = 0;

const statusEl = document.getElementById('status');

function setStatus(text, ok) {
  statusEl.textContent = text;
  statusEl.style.color = ok ? '#4ade80' : '#f87171';
}

async function pollCurrent() {
  try {
    const res = await fetch('/api/current');
    const data = await res.json();

    document.getElementById('temp').textContent = data.temp_valid ? data.temperature_f.toFixed(1) : '--';
    document.getElementById('humidity').textContent = data.humidity_valid ? data.humidity_pct.toFixed(0) : '--';
    document.getElementById('pressure').textContent = data.pressure_valid ? data.pressure_hpa.toFixed(1) : '--';
    document.getElementById('altitude').textContent = data.pressure_valid ? data.altitude_m.toFixed(0) : '--';

    const rainEl = document.getElementById('rain');
    rainEl.textContent = data.rain_valid ? data.rain_intensity_pct.toFixed(0) : '--';
    rainEl.style.color = data.rain_valid && data.is_raining ? '#38bdf8' : '';

    document.getElementById('forecast-text').textContent = data.forecast || '--';
    document.getElementById('forecast-trend').textContent = data.forecast_trend_valid
      ? (data.forecast_trend_hpa_3h >= 0 ? '+' : '') + data.forecast_trend_hpa_3h.toFixed(1) + ' hPa over 3h'
      : '';

    if (!data.temp_valid || !data.humidity_valid || !data.pressure_valid || !data.rain_valid) {
      const missing = [
        !data.temp_valid && 'DS18B20',
        !data.humidity_valid && 'DHT11',
        !data.pressure_valid && 'BMP280',
        !data.rain_valid && 'rain sensor',
      ].filter(Boolean).join(', ');
      setStatus(missing + ' not detected', false);
    } else {
      setStatus((data.is_raining ? 'raining — ' : '') + 'updated ' + new Date().toLocaleTimeString(), true);
    }
  } catch (err) {
    setStatus('connection lost, retrying...', false);
  }
}

function drawChart(points) {
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  if (points.length < 2) return;

  const temps = points.map(p => p.temperature_c * 9 / 5 + 32);
  const min = Math.min(...temps) - 2;
  const max = Math.max(...temps) + 2;

  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 2;
  ctx.beginPath();
  temps.forEach((t, i) => {
    const x = (i / (temps.length - 1)) * (w - 20) + 10;
    const y = h - 20 - ((t - min) / (max - min || 1)) * (h - 40);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  ctx.fillStyle = '#94a3b8';
  ctx.font = '12px sans-serif';
  ctx.fillText(max.toFixed(0) + '°F', 8, 16);
  ctx.fillText(min.toFixed(0) + '°F', 8, h - 8);
}

async function pollHistory() {
  try {
    const res = await fetch('/api/history');
    const data = await res.json();
    drawChart(data.points || []);
  } catch (err) {
    // Chart just stays stale until the next successful poll.
  }
}

function initRadar() {
  const radarEl = document.getElementById('radar');

  if (STATION_LAT === 0 && STATION_LON === 0) {
    radarEl.innerHTML = '<div class="setup-notice">Set STATION_LAT / STATION_LON at the top of index.html\'s script to your coordinates to show radar here.</div>';
    return;
  }

  // RainViewer's free embeddable map, no API key required.
  const src = 'https://www.rainviewer.com/map.html?loc=' + STATION_LAT + ',' + STATION_LON +
    ',7&oFa=0&oC=1&oU=0&oCS=1&c=3&o=83&lm=1&layer=radar&sm=1&sn=1';
  const iframe = document.createElement('iframe');
  iframe.src = src;
  iframe.loading = 'lazy';
  iframe.title = 'Radar';
  radarEl.appendChild(iframe);
}

pollCurrent();
pollHistory();
initRadar();
setInterval(pollCurrent, 5000);
setInterval(pollHistory, 30000);
</script>
</body>
</html>
