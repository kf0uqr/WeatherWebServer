; PlatformIO project configuration
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Lower than the 921600 default: some USB-serial adapters/cables can't
; sustain the high rate through a full flash write and drop mid-upload.
upload_speed = 115200

lib_deps =
    adafruit/Adafruit BMP280 Library@^2.6.8
    adafruit/Adafruit Unified Sensor@^1.1.14
    milesburton/DallasTemperature@^3.11.0
    paulstoffregen/OneWire@^2.3.8
    adafruit/DHT sensor library@^1.4.6
    ESP32Async/ESPAsyncWebServer@^3.6.0
    ESP32Async/AsyncTCP@^3.3.2
    bblanchon/ArduinoJson@^7.2.1

; Uploads data/ (the web dashboard) to SPIFFS
board_build.filesystem = spiffs

; Upload over WiFi instead of USB once the device is already running
; OTA-enabled firmware. Usage:
;   OTA_HOST=weather.local OTA_PASSWORD=yourpassword pio run -e esp32dev_ota -t upload
;   OTA_HOST=weather.local OTA_PASSWORD=yourpassword pio run -e esp32dev_ota -t uploadfs
; OTA_PASSWORD must match the OTA_PASSWORD in include/secrets.h. Set both
; env vars in your shell rather than here so the password stays out of git.
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = ${sysenv.OTA_HOST}
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
